[project]
name = "forklift-fleet"
version = "0.1.0"
description = "The warehouse is the robot: ceiling-camera localized forklift fleet"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
cloud = [
  "aws-cdk-lib==2.220.0",
  "constructs>=10.4,<11",
  "boto3[crt]>=1.35",
]
edge = [
  "numpy>=2",
  "opencv-contrib-python>=4.10",
  "pupil-apriltags>=1.0.4",
  "pyserial>=3.5",
  "awsiotsdk>=1.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared/fleet_shared", "edge/fleet_edge", "cloud/fleet_cloud"]

[tool.pytest.ini_options]
testpaths = ["shared/tests", "edge/tests", "cloud/tests"]
pythonpath = ["cloud/lambdas", "cloud/tests"]
